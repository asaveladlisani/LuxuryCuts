databases:
  - name: luxurycuts-db
    plan: free
    databaseName: luxurycuts
    user: luxurycuts

services:
  - type: web
    name: luxurycuts-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CORS_ORIGIN
        value: https://asaveladlisani.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: luxurycuts-db
          property: connectionString
